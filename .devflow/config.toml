[project]
name = "decision-platform"
language = "typescript"
stack = "pnpm + TurboRepo + Vite + Vue + TypeScript"
version = "0.1.6"

[commands]
build = "pnpm run build"
lint = "pnpm run lint"
test = ""
test_unit = ""
test_integration = ""

[paths]
src = "apps"
tests = "apps"
docs = ".devflow"

[constraints]
zero_warnings = true
zero_mocks = false
nullable = true

[workflow]
stages = [ "backlog", "analyzing", "analyzed", "approved", "in_progress", "done",]
