# Reasonix configuration.
# Resolution order: flag > ./reasonix.toml > ~/.reasonix/config.toml > built-in defaults.
# Fields marked user/global only are not overridden by ./reasonix.toml.
# Secrets come from the environment via api_key_env; never put keys here.

config_version = 2   # schema marker for diagnostics; old versions may ignore it
default_model = "deepseek-flash"
# language      = "zh"   # ui/model language; empty = auto-detect from $LANG / $REASONIX_LANG

[agent]
# system_prompt = """..."""   # omit to use the built-in prompt for this version
# system_prompt_file = "prompts/system.md"   # overrides system_prompt when set
temperature       = 0.0
# reasoning_language = "zh"   # visible reasoning language: auto|zh|en
# auto_plan_classifier = "deepseek-flash"   # optional; only used for borderline tasks
soft_compact_ratio  = 0.5   # notice only; keeps cache-first prefix intact
compact_ratio       = 0.8   # try compacting when prompt reaches this fraction
compact_force_ratio = 0.9   # force compacting at this high-water mark
# keep                = ["errors"]   # compaction keep policy: errors, user_marked
# recent_keep         = 2   # minimum recent messages kept verbatim
cold_resume_prune   = true   # elide stale tool results when reopening a session past the provider cache window
# planner_model = "deepseek-pro"   # optional: enable two-model collaboration
# subagent_model = "deepseek-pro"   # optional default for runAs=subagent skills
# subagent_models = { review = "deepseek-pro", security_review = "deepseek-pro" }   # per-skill overrides
# subagent_effort = "high"   # optional default effort for subagents
# subagent_efforts = { review = "max", task = "high" }   # per-tool/skill effort overrides
# output_style = "explanatory"   # explanatory | learning | concise | custom; empty = default

[[providers]]
name        = "deepseek-flash"
kind        = "openai"
base_url    = "https://api.deepseek.com"
model       = "deepseek-v4-flash"
api_key_env = "DEEPSEEK_API_KEY"
balance_url = "https://api.deepseek.com/user/balance"   # optional; wallet-balance endpoint shown in the status bar
context_window = 1000000   # tokens; compaction triggers near this limit
price       = { cache_hit = 0.02, input = 1, output = 2, currency = "¥" }   # provider-wide fallback, per 1M tokens
prices      = { "deepseek-v4-flash" = { cache_hit = 0.02, input = 1, output = 2, currency = "¥" } }   # per-model prices, per 1M tokens

[[providers]]
name        = "deepseek-pro"
kind        = "openai"
base_url    = "https://api.deepseek.com"
model       = "deepseek-v4-pro"
api_key_env = "DEEPSEEK_API_KEY"
balance_url = "https://api.deepseek.com/user/balance"   # optional; wallet-balance endpoint shown in the status bar
context_window = 1000000   # tokens; compaction triggers near this limit
price       = { cache_hit = 0.025, input = 3, output = 6, currency = "¥" }   # provider-wide fallback, per 1M tokens
prices      = { "deepseek-v4-pro" = { cache_hit = 0.025, input = 3, output = 6, currency = "¥" } }   # per-model prices, per 1M tokens

[[providers]]
name        = "mimo-pro"
kind        = "openai"
base_url    = "https://token-plan-cn.xiaomimimo.com/v1"
models      = ["mimo-v2.5-pro", "mimo-v2.5"]
default     = "mimo-v2.5-pro"
api_key_env = "MIMO_API_KEY"
context_window = 1000000   # tokens; compaction triggers near this limit
price       = { cache_hit = 0.025, input = 3, output = 6, currency = "¥" }   # provider-wide fallback, per 1M tokens
prices      = { "mimo-v2.5" = { cache_hit = 0.02, input = 1, output = 2, currency = "¥" }, "mimo-v2.5-pro" = { cache_hit = 0.025, input = 3, output = 6, currency = "¥" } }   # per-model prices, per 1M tokens
vision_models = ["mimo-v2.5"]   # models in this provider that accept image input
no_proxy    = true   # reach this base_url directly, never via the proxy

[[providers]]
name        = "mimo-flash"
kind        = "openai"
base_url    = "https://token-plan-cn.xiaomimimo.com/v1"
models      = ["mimo-v2.5-pro", "mimo-v2.5"]
default     = "mimo-v2.5"
api_key_env = "MIMO_API_KEY"
context_window = 1000000   # tokens; compaction triggers near this limit
price       = { cache_hit = 0.02, input = 1, output = 2, currency = "¥" }   # provider-wide fallback, per 1M tokens
prices      = { "mimo-v2.5" = { cache_hit = 0.02, input = 1, output = 2, currency = "¥" }, "mimo-v2.5-pro" = { cache_hit = 0.025, input = 3, output = 6, currency = "¥" } }   # per-model prices, per 1M tokens
vision_models = ["mimo-v2.5"]   # models in this provider that accept image input
no_proxy    = true   # reach this base_url directly, never via the proxy

[tools]
enabled = []   # empty = all built-in tools
bash_timeout_seconds = 120   # foreground safety cap; set 0 for no tool-local cap

[tools.background_jobs]
stalled_warning_seconds = 900   # warn once per background job after this many quiet seconds; 0 disables

[lsp]
enabled = true   # language server tools; servers launch lazily when used
# [lsp.servers.go]
# command = "gopls"
# args = []
# extensions = [".go"]

[skills]
# paths = ["~/my-skills", "../shared/skills"]   # extra custom skill roots
# excluded_paths = [".agents/skills"]   # hide convention roots without deleting folders
# max_depth = 3   # nested scan depth; set 1 for legacy root-only discovery
# disabled_skills = ["review"]   # hide noisy or unwanted skills

[permissions]
allow = ["Bash(ls -lt /Users/admin/.reasonix/sessions/ | head -5)", "Bash(ls -lt /Users/admin/.reasonix/sessions/ | grep -i \"deepseek\" | head -10)", "Bash(ls /Users/admin/.reasonix/sessions/ | grep \"deepseek\" | head -20)", "Bash(ls -lt /Users/admin/.reasonix/sessions/ | head -20)", "Bash(cat /Users/admin/.reasonix/sessions/code-Desktop.meta.json 2>/dev/null || echo \"not found\")", "Bash(cd /Users/admin/.reasonix/sessions && ls -lt | head -25 && echo \"---\" && ls -lt */ | head -10 2>/dev/null)", "Bash(find /Users/admin/.reasonix -name \"*.json\" -newer /Users/admin/.reasonix/sessions/code-optimos-intco-frontend.meta.json 2>/dev/null | head -20)", "Edit", "task", "Bash(find /Users/admin/.reasonix -name \"*hook*\" -o -name \"*HOOK*\" 2>/dev/null | head -30)", "Bash(find /Users/admin/.agents -name \"*hook*\" -o -name \"*HOOK*\" 2>/dev/null | head -30)", "Bash(find /Users/admin/.reasonix -type f -name \"*.toml\" -o -name \"*.json\" -o -name \"*.yaml\" -o -name \"*.yml\" 2>/dev/null | head -20)", "Bash(reasonix --help 2>/dev/null | grep -i hook || echo \"no hook flag found\")", "Bash(ls /Users/admin/.reasonix/pipeline/ 2>/dev/null || echo \"no pipeline dir\")", "Bash(ls /Users/admin/.agents/pipeline/ 2>/dev/null || echo \"no agents pipeline\")", "Bash(find /Users/admin/.reasonix -name \"*.toml\" -path \"*/project*\" 2>/dev/null; find /Users/admin/Desktop/projects/optimos-intco-frontend -name \"reasonix.toml\" 2>/dev/null)", "Bash(cd /Users/admin/Desktop/projects/optimos-intco-frontend && echo \"=== 完整性检查 ===\" && echo \"--- Hooks 事件关键覆盖 ---\" && for event in SessionStart SessionEnd PreToolUse PostToolUse PreCompact UserPromptSubmit; do c=$(grep -c \"$event\" DEVFLOW_WORKFLOW_SHARE.md); echo \"  $event: $c 处\"; done && echo \"--- 配置文件引用 ---\" && grep -c 'hooks\\.json' DEVFLOW_WORKFLOW_SHARE.md && echo \"--- settings.json 引用 ---\" && grep -c 'settings\\.json' DEVFLOW_WORKFLOW_SHARE.md && echo \"--- exit 2 引用 ---\" && grep -c 'exit 2' DEVFLOW_WORKFLOW_SHARE.md && echo \"--- 行数 ---\" && wc -l DEVFLOW_WORKFLOW_SHARE.md)", "Bash(cd /Users/admin/Desktop/projects/optimos-intco-frontend && pnpm -s run devflow:start -- --mode tweak --change fix-devflow-worker-tools 2>&1)", "Bash(cd /Users/admin/Desktop/projects/optimos-intco-frontend && pnpm -s run harness:skip -- --id fix-devflow-worker-tools --marker AUTO-SKIP --reason tweak:auto 2>&1)", "Bash(cd /Users/admin/Desktop/projects/optimos-intco-frontend && pnpm -s run devflow:done 2>&1)", "Bash(cd /Users/admin/Desktop/projects/optimos-intco-frontend && pnpm -s run harness:tweak -- --id fix-devflow-worker-tools 2>&1)"]
[sandbox]
# Confine tool blast radius. File-writers (write_file/edit_file/multi_edit/move_file)
# may only write under workspace_root (empty = current dir) and allow_write extras.
# bash = "enforce" (default) jails each command in an OS sandbox (macOS now;
# graceful fallback elsewhere); "off" disables it. network allows egress.
# workspace_root = ""            # default: current working directory
# allow_write = ["/tmp"]          # extra dirs writers may also modify
bash    = "enforce"
network = true

[statusline]
# A custom status line: a command whose first stdout line replaces the built-in
# data row. It receives {"model","contextUsed","contextWindow","cwd"} as JSON on stdin.
# command = "my-statusline.sh"

