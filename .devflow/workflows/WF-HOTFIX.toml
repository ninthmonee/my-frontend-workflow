# WF-HOTFIX: Strict methodology with urgent-fix strategy
# 详细协议见 AGENTS.md「Phase 执行协议」（hotfix: blast-radius, rollback plan, severity=high）

[workflow]
id = "WF-HOTFIX"
name = "WF Hotfix"
description = "Strict methodology for urgent fixes, with tight blast-radius controls"
version = "2.2"

[[steps]]
id = "set-change"
name = "Set Change Name"
prompt = """## Set Change Name — `devflow set change <name>`"""
gates = ["state_set:change"]
next = "init"

[[steps]]
id = "init"
name = "Init (Hotfix)"
prompt = """## Init (Hotfix) — Gate 状态由 devflow:start 自动初始化（task-type: mandatory）"""
gates = []
next = "phase0"

[[steps]]
id = "phase0"
name = "Phase 0: Preflight"
prompt = """
## Phase 0: Preflight — 改前准备（检索→拆解→填槽位: Scope + Risks + Blast radius + Rollback note）
> HOTFIX: 强制输出 Blast radius + Rollback note
> 详细协议: AGENTS.md「Phase 0 — 改前准备」

Gate
```bash
pnpm -s run harness:p0 -- --id {change}
pnpm -s run harness:tasks -- --id {change}
pnpm -s run harness:p0 -- --id {change} --check
pnpm -s run harness:tasks -- --id {change} --check
pnpm -s run harness:gate -- --phase p0 --id {change}
```
"""
gates = [
  "command_success:pnpm -s run harness:p0 -- --id {change}",
  "file_exists:.devflow/evidence/{change}/P0.md",
  "command_success:pnpm -s run harness:tasks -- --id {change}",
  "file_exists:.devflow/evidence/{change}/TASKS.md",
  "command_success:pnpm -s run harness:p0 -- --id {change} --check",
  "command_success:pnpm -s run harness:tasks -- --id {change} --check",
  "command_success:pnpm -s run harness:gate -- --phase p0 --id {change}",
]
next = "phase1"

[[steps]]
id = "phase1"
name = "Phase 1: Implementation"
prompt = """
## Phase 1: Implementation — 最小改动 + snapshot
> HOTFIX: 强制输出 Risk mitigation + Rollback plan
> 详细协议: AGENTS.md「Phase 1 — 开发」

Gate
```bash
pnpm -s run harness:p1 -- --id {change}
pnpm -s run harness:p1 -- --id {change} --check
pnpm -s run harness:tasks -- --id {change} --check
pnpm -s run harness:gate -- --phase p1 --id {change}
```
"""
gates = [
  "command_success:pnpm -s run harness:p1 -- --id {change}",
  "file_exists:.devflow/evidence/{change}/P1.md",
  "command_success:pnpm -s run harness:p1 -- --id {change} --check",
  "command_success:pnpm -s run harness:tasks -- --id {change} --check",
  "command_success:pnpm -s run harness:gate -- --phase p1 --id {change}",
]
next = "phase2"

[[steps]]
id = "phase2"
name = "Phase 2: Verification + 收敛 Loop"
prompt = """
## Phase 2: Verification + 收敛 Loop — build→lint→typecheck
> 详细协议: AGENTS.md「Phase 2 — 验证 + 收敛 Loop」

Gate
```bash
pnpm -s run harness:p2 -- --id {change} --build full --lint
pnpm -s run harness:gate -- --phase p2 --id {change}
```
"""
gates = [
  "command_success:pnpm -s run harness:p2 -- --id {change} --build full --lint",
  "file_exists:.devflow/evidence/{change}/P2.md",
  "command_success:pnpm -s run harness:gate -- --phase p2 --id {change}",
]
next = "phase3"

[[steps]]
id = "phase3"
name = "Phase 3: Self-check"
prompt = """
## Phase 3: Self-check — 收尾自检 + 用户确认
> HOTFIX: 验证 Rollback plan + snapshot 可用性
> 详细协议: AGENTS.md「Phase 3 — 收尾自检」

Gate
```bash
pnpm -s run harness:gate-verify -- --id {change}
pnpm -s run harness:p3 -- --id {change}
pnpm -s run harness:gate -- --phase p3 --id {change}
```
"""
gates = [
  "command_success:pnpm -s run harness:gate-verify -- --id {change}",
  "command_success:pnpm -s run harness:p3 -- --id {change}",
  "file_exists:.devflow/evidence/{change}/P3.md",
  "command_success:pnpm -s run harness:gate -- --phase p3 --id {change}",
]
next = "phase4"

[[steps]]
id = "phase4"
name = "Phase 4: Knowledge Precipitation"
prompt = """
## Phase 4: Knowledge Precipitation — 经验沉淀
> HOTFIX: 优先 fix type, severity=high
> 详细协议: AGENTS.md「Phase 4 — 知识沉淀」

Gate
```bash
pnpm -s run harness:p4 -- --id {change}
pnpm -s run harness:gate -- --phase done --id {change}
```
"""
gates = [
  "command_success:pnpm -s run harness:p4 -- --id {change}",
  "file_exists:.devflow/evidence/{change}/P4.md",
  "command_success:pnpm -s run harness:gate -- --phase done --id {change}",
]
next = ""
